name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'package-lock.json'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - 'package-lock.json'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

jobs:
  # ── #1459: Explicit TypeScript typecheck ─────────────────────────────────────
  # Runs tsc --noEmit before the expensive production build so type errors
  # surface in ~30 s instead of waiting for the full next build (~3–5 min).
  # Uses the node_modules cache so repeated runs skip npm ci entirely.
  frontend-typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

  frontend-checks:
    name: Build, test & bundle budget
    runs-on: ubuntu-latest
    # Wait for typecheck so type errors fail fast without wasting build minutes.
    needs: frontend-typecheck
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        run: npm test -- --run

      # #1462 — Assert MSW is tree-shaken from production bundles.
      # Runs the source-level audit that verifies msw/browser is never
      # statically imported outside src/mocks/ and that msw-provider.tsx
      # only dynamically imports the worker behind NODE_ENV guards.
      - name: MSW tree-shake audit
        run: npm test -- --run src/mocks/msw-tree-shake.test.ts

      - name: Build frontend
        run: npm run build

      # ── #1460: Bundle size budget check ────────────────────────────────────
      # Runs after the production build so .next/static/chunks is populated.
      # Fails the job (exit 1) if any budget defined in .size-limit.json is
      # exceeded. See frontend/BUNDLE_BUDGET.md for thresholds and exemptions.
      - name: Check bundle size
        run: npm run bundle:check

      - name: Upload bundle size report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-report
          path: frontend/bundle-size-report.json
          retention-days: 30

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Advisory for now: the existing tree still has ESLint violations
      # (tracked separately). New code must not add any — see CONTRIBUTING.md.
      # Flip `continue-on-error` to false once the backlog is at zero.
      - name: Lint
        run: npm run lint
        continue-on-error: true

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      # Hermetic: mocks its own network via page.route + MSW. Failure blocks.
      - name: E2E smoke (join-room)
        run: npm run test:e2e:smoke

      # Advisory until the auth/MSW fixtures for these journeys are hardened.
      - name: E2E critical journeys
        run: npm run test:e2e:critical
        continue-on-error: true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces & screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7

  # ── Chromatic visual regression ─────────────────────────────────────────────
  # Runs only when frontend source files change.
  # Fork PRs: CHROMATIC_PROJECT_TOKEN will be empty → step is skipped, not failed.
  # Merge to main: full snapshot run; diffs surface in the Chromatic UI.
  chromatic:
    name: Chromatic visual regression
    runs-on: ubuntu-latest
    needs: frontend-checks
    # Only run when frontend files are touched.
    if: |
      contains(toJson(github.event.commits.*.modified), 'frontend/') ||
      contains(toJson(github.event.commits.*.added), 'frontend/') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Chromatic needs full git history to detect changed stories correctly.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Skip on forks (no access to repo secrets) without failing the build.
      - name: Publish to Chromatic
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: npm run chromatic -- --project-token=$CHROMATIC_PROJECT_TOKEN
