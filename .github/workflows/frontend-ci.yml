name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'package-lock.json'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - 'package-lock.json'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Advisory for now: the existing tree still has ESLint violations
      # (tracked separately). New code must not add any — see CONTRIBUTING.md.
      # Flip `continue-on-error` to false once the backlog is at zero.
      - name: Lint
        run: npm run lint
        continue-on-error: true

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      # Hermetic: mocks its own network via page.route + MSW. Failure blocks.
      - name: E2E smoke (join-room)
        run: npm run test:e2e:smoke

      # Advisory until the auth/MSW fixtures for these journeys are hardened.
      - name: E2E critical journeys
        run: npm run test:e2e:critical
        continue-on-error: true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces & screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7

  # ── Chromatic visual regression ─────────────────────────────────────────────
  # Runs only when frontend source files change.
  # Fork PRs: CHROMATIC_PROJECT_TOKEN will be empty → step is skipped, not failed.
  # Merge to main: full snapshot run; diffs surface in the Chromatic UI.
  chromatic:
    name: Chromatic visual regression
    runs-on: ubuntu-latest
    needs: frontend-checks
    # Only run when frontend files are touched.
    if: |
      contains(toJson(github.event.commits.*.modified), 'frontend/') ||
      contains(toJson(github.event.commits.*.added), 'frontend/') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Chromatic needs full git history to detect changed stories correctly.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Skip on forks (no access to repo secrets) without failing the build.
      - name: Publish to Chromatic
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: npm run chromatic -- --project-token=$CHROMATIC_PROJECT_TOKEN
