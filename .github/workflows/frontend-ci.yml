name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'package-lock.json'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - 'package-lock.json'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

jobs:
  # ── #1459: Explicit TypeScript typecheck ─────────────────────────────────────
  # Runs tsc --noEmit before the expensive production build so type errors
  # surface in ~30 s instead of waiting for the full next build (~3–5 min).
  # Uses the node_modules cache so repeated runs skip npm ci entirely.
  frontend-typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint frontend
        run: npm run lint -- --max-warnings=0

      - name: Typecheck frontend
        run: npm run typecheck

      # Bundle budget is checked in `frontend-checks` after the production
      # build; there is no .next/ output to measure at this point (#1759).

  # ── #1759 / #1760: Dependency-free gate self-tests ─────────────────────────
  # Runs the node:test suites for the repo's zero-dependency CI scripts
  # (bundle budget gate, …). Needs no `npm ci`, so gate logic stays verified
  # and fork PRs run it with no secrets.
  frontend-gates:
    name: Gate script self-tests (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run gate self-tests
        run: node --test scripts/*.test.mjs

  # ── #1811: Forbidden Stellar copy deny-list gate ────────────────────────────
  # Scans frontend player-facing copy/source for forbidden Stellar strings
  # (Stellar/XLM/Lumens/Soroban wallet references) per ADR-003. NEAR is the
  # only supported chain UI until Stellar is gated ready. Fails (exit 1) on
  # any match with file:line reporting. Deny-list lives in
  # frontend/docs/SW-deny-list.md and frontend/scripts/deny-list.mjs.
  frontend-deny-list:
    name: Forbidden Stellar copy deny-list
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check forbidden Stellar copy strings
        run: node scripts/deny-list.mjs

  frontend-checks:
    name: Build, test & bundle budget
    runs-on: ubuntu-latest
    # Wait for typecheck so type errors fail fast without wasting build minutes.
    needs: frontend-typecheck
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        run: npm test -- --run

      # #1462 — Assert MSW is tree-shaken from production bundles.
      # Runs the source-level audit that verifies msw/browser is never
      # statically imported outside src/mocks/ and that msw-provider.tsx
      # only dynamically imports the worker behind NODE_ENV guards.
      - name: MSW tree-shake audit
        run: npm test -- --run src/mocks/msw-tree-shake.test.ts

      - name: Build frontend
        run: npm run build

      # ── #1460 / #1759: Bundle size budget + regression gate ────────────────
      # Runs after the production build so .next/ is populated. Exit 1 when a
      # budget in .size-limit.json is over its limit, regresses beyond the
      # allowance over bundle-baseline.json, or MSW code reaches a client
      # chunk; exit 2 (fail closed) on missing build output or bad config.
      # Invoked with node directly so it does not depend on package.json
      # scripts. See frontend/BUNDLE_BUDGET.md.
      - name: Check bundle size
        run: node scripts/check-bundle-size.mjs

      - name: Upload bundle size report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-report
          path: frontend/bundle-size-report.json
          retention-days: 30

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Advisory for now: the existing tree still has ESLint violations
      # (tracked separately). New code must not add any — see CONTRIBUTING.md.
      # Flip `continue-on-error` to false once the backlog is at zero.
      - name: Lint
        run: npm run lint
        continue-on-error: true

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      # Hermetic: mocks its own network via page.route + MSW. Failure blocks.
      - name: E2E smoke (join-room)
        run: npm run test:e2e:smoke

      # ── #1731: Critical journeys beyond smoke ──────────────────────────────
      # Runs frontend/e2e/critical-journeys.spec.ts covering the funnel beyond
      # the join-room smoke path: loading/empty/error states, wallet reject,
      # double CTA clicks, auth expiry, and a11y focus order. Hermetic via
      # page.route + MSW fixtures (no prod mocks). Failure now blocks the job
      # so regressions in critical journeys cannot merge.
      - name: E2E critical journeys
        run: npm run test:e2e:critical

      # ── #1760 / #1761: Consent + well-known manifest ────────────────────────
      # No analytics beacons before consent; consent banner keyboard path;
      # withdrawal from /privacy-policy; /.well-known/farcaster.json fails
      # closed (404) unless configured, and rejects non-GET methods.
      - name: E2E analytics consent + Farcaster manifest
        run: npx playwright test e2e/analytics-consent.spec.ts e2e/farcaster-manifest.spec.ts

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces & screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7

  # ── #1735: Chromatic visual regression for wallet/join/shop stories ─────────
  # Publishes the Storybook build to Chromatic so wallet, join, and shop
  # stories get deterministic visual baselines. Stories must use fixed
  # props/mocks (see frontend/docs/CHROMATIC_BASELINES.md) so snapshots are
  # stable across runs. Runs only when frontend source files change.
  # Fork PRs: CHROMATIC_PROJECT_TOKEN will be empty → step is skipped, not
  # failed. Merge to main: full snapshot run; diffs surface in the Chromatic UI
  # where reviewers accept/reject per the baseline approval workflow.
  chromatic:
    name: Chromatic visual regression
    runs-on: ubuntu-latest
    needs: frontend-checks
    # Only run when frontend files are touched.
    if: |
      contains(toJson(github.event.commits.*.modified), 'frontend/') ||
      contains(toJson(github.event.commits.*.added), 'frontend/') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Chromatic needs full git history to detect changed stories correctly.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Skip on forks (no access to repo secrets) without failing the build.
      - name: Publish to Chromatic
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: npm run chromatic -- --project-token=$CHROMATIC_PROJECT_TOKEN
