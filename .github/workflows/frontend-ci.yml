name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        run: npm test -- --run

      # #1462 — Assert MSW is tree-shaken from production bundles.
      # Runs the source-level audit that verifies msw/browser is never
      # statically imported outside src/mocks/ and that msw-provider.tsx
      # only dynamically imports the worker behind NODE_ENV guards.
      - name: MSW tree-shake audit
        run: npm test -- --run src/mocks/msw-tree-shake.test.ts

      - name: Build frontend
        run: npm run build

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Advisory for now: the existing tree still has ESLint violations
      # (tracked separately). New code must not add any — see CONTRIBUTING.md.
      # Flip `continue-on-error` to false once the backlog is at zero.
      - name: Lint
        run: npm run lint
        continue-on-error: true

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      # Hermetic: mocks its own network via page.route + MSW. Failure blocks.
      - name: E2E smoke (join-room)
        run: npm run test:e2e:smoke

      # Advisory until the auth/MSW fixtures for these journeys are hardened.
      - name: E2E critical journeys
        run: npm run test:e2e:critical
        continue-on-error: true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces & screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7
