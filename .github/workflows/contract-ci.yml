name: Contract CI

on:
  pull_request:
    paths:
      - 'contract/**'
      - '.github/workflows/contract-ci.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'contract/**'
      - '.github/workflows/contract-ci.yml'
  workflow_dispatch:

concurrency:
  group: contract-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Hygiene: cargo fmt --check + clippy -D warnings ────────────────────────
  # Mirrors `make hygiene` from contract/Makefile.
  contract-hygiene:
    name: Format & clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-cargo-contract-${{ hashFiles('contract/Cargo.lock', 'contract/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-contract-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── Contract checks: build WASM, size budget, tests ──────────────────────
  # Mirrors `make ci` from contract/Makefile, excluding hygiene (run above).
  contract-checks:
    name: Build, WASM size & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (with wasm target)
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-cargo-contract-${{ hashFiles('contract/Cargo.lock', 'contract/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-contract-

      - name: Install jq (for wasm size check)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build release WASM
        run: cargo build --target wasm32-unknown-unknown --release

      # ── #1743: WASM size budget enforcement ──────────────────────────────
      # Compares release WASM sizes against contract/ci/wasm-size-budget.json.
      # Fails if any contract exceeds baseline + regression_threshold_percent%.
      - name: Check WASM size budget
        run: bash scripts/check-wasm-sizes.sh
        env:
          GITHUB_STEP_SUMMARY: ${{ runner.temp }}/wasm-size-summary.md

      - name: Upload WASM size report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: wasm-size-report
          path: contract/deploy/wasm-size-report.md
          retention-days: 30

      - name: Run unit tests (all workspace members)
        run: cargo test --all

  # ── Integration tests (separate job, depends on checks) ──────────────────
  contract-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: contract-checks
    defaults:
      run:
        working-directory: contract

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-cargo-contract-${{ hashFiles('contract/Cargo.lock', 'contract/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-contract-

      - name: Run integration tests
        run: cargo test --package tycoon-integration-tests -- --nocapture