name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Run backend tests
        run: npm test -- --runInBand

      - name: Verify admin route authorization
        run: npm run test:e2e -- --runInBand admin-role-verification.e2e-spec.ts

  shop-api-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shop-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: shop-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run shop API tests
        run: npm test

      - name: Build shop API
        run: npm run build
