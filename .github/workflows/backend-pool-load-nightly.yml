name: Backend Pool Load Nightly

# Nightly load-budget verification for the backend database pool.
# See backend/docs/DATABASE_POOL.md for sizing rules and rollback steps.
#
# This job is a dry-run/verification gate: it validates the pool configuration
# that the backend would boot with, then runs the pool load-budget script in
# dry-run mode. It never touches production data and requires no secrets.

on:
  schedule:
    # 03:17 UTC daily (off-peak, avoids top-of-hour CI contention).
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the load-budget check in dry-run mode only'
        type: boolean
        default: true

# Least privilege: read-only repo access, no write scopes, no secrets.
permissions:
  contents: read

# Never run overlapping nightly checks; cancel stale runs on manual dispatch.
concurrency:
  group: backend-pool-load-nightly
  cancel-in-progress: false

jobs:
  pool-load-budget:
    name: Pool config + load budget (dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: production
      # Documented pool sizing defaults (see backend/docs/DATABASE_POOL.md).
      # These mirror the production budget so the boot check fails closed on
      # misconfiguration before any load is generated.
      DB_POOL_MAX: '20'
      DB_POOL_MIN: '2'
      DB_POOL_IDLE_TIMEOUT_MS: '30000'
      DB_POOL_CONNECTION_TIMEOUT_MS: '5000'
      DB_POOL_MAX_LIFETIME_MS: '1800000'
      # Load-budget thresholds enforced by the dry-run script.
      POOL_LOAD_BUDGET_P95_MS: '250'
      POOL_LOAD_BUDGET_MAX_WAITERS: '5'
      POOL_LOAD_BUDGET_DURATION_S: '60'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Validate pool configuration (fail-closed)
        working-directory: backend
        run: |
          set -euo pipefail
          node -e '
            const required = [
              "DB_POOL_MAX",
              "DB_POOL_MIN",
              "DB_POOL_IDLE_TIMEOUT_MS",
              "DB_POOL_CONNECTION_TIMEOUT_MS",
              "DB_POOL_MAX_LIFETIME_MS",
            ];
            const missing = required.filter((k) => !process.env[k]);
            if (missing.length) {
              console.error("Missing pool env vars: " + missing.join(", "));
              process.exit(1);
            }
            const max = Number(process.env.DB_POOL_MAX);
            const min = Number(process.env.DB_POOL_MIN);
            const idle = Number(process.env.DB_POOL_IDLE_TIMEOUT_MS);
            const conn = Number(process.env.DB_POOL_CONNECTION_TIMEOUT_MS);
            const life = Number(process.env.DB_POOL_MAX_LIFETIME_MS);
            const errors = [];
            if (!Number.isInteger(max) || max < 1) errors.push("DB_POOL_MAX must be an integer >= 1");
            if (!Number.isInteger(min) || min < 0) errors.push("DB_POOL_MIN must be an integer >= 0");
            if (min > max) errors.push("DB_POOL_MIN must be <= DB_POOL_MAX");
            if (!Number.isInteger(idle) || idle < 1000) errors.push("DB_POOL_IDLE_TIMEOUT_MS must be >= 1000");
            if (!Number.isInteger(conn) || conn < 250) errors.push("DB_POOL_CONNECTION_TIMEOUT_MS must be >= 250");
            if (!Number.isInteger(life) || life < 60000) errors.push("DB_POOL_MAX_LIFETIME_MS must be >= 60000");
            if (errors.length) {
              console.error("Invalid pool configuration:\n - " + errors.join("\n - "));
              process.exit(1);
            }
            console.log("Pool configuration OK: max=" + max + " min=" + min);
          '

      - name: Run pool load-budget check (dry-run)
        working-directory: backend
        run: |
          set -euo pipefail
          if [ -f scripts/pool-load-budget.mjs ]; then
            node scripts/pool-load-budget.mjs --dry-run
          elif [ -f scripts/pool-load-budget.js ]; then
            node scripts/pool-load-budget.js --dry-run
          else
            echo "::warning::No pool load-budget script found; skipping dry-run."
            echo "Expected backend/scripts/pool-load-budget.{mjs,js} per backend/docs/DATABASE_POOL.md"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Backend pool load budget (nightly)"
            echo ""
            echo "- Pool config validated fail-closed against backend/docs/DATABASE_POOL.md"
            echo "- Load-budget dry-run executed (no production traffic)"
            echo "- Rollback/order-of-operations: see backend/docs/DATABASE_POOL.md"
          } >> "$GITHUB_STEP_SUMMARY"
