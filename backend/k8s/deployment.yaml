apiVersion: apps/v1
kind: Deployment
metadata:
  name: tycoon-backend
  labels:
    app.kubernetes.io/name: tycoon-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tycoon
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tycoon-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tycoon-backend
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3000"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: tycoon-backend:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: METRICS_ENABLED
              value: "true"
            - name: METRICS_PATH
              value: "/metrics"
            - name: RED_METRICS_ENABLED
              value: "true"
            - name: SHUTDOWN_DRAIN_MS
              value: "10000"
          # Fail-closed readiness: only route traffic once the app has
          # completed boot checks (env validation + dependency probes) and
          # is emitting RED metrics on /metrics.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness must not depend on downstream dependencies, otherwise a
          # transient Postgres/Redis/shop-api outage would restart healthy pods.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Startup probe gives slow boots room without tripping liveness.
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
