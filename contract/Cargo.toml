[workspace]
resolver = "2"
members = [
  "contracts/*",
  "integration-tests",
]

# Exclude archived/experimental contracts from the workspace
exclude = [
  "archive/*",
  "contracts/tycoon-main-game",
]

[workspace.dependencies]
soroban-sdk = "23"

# Shared workspace metadata so every contracts/* crate aligns with the
# contract/README roadmap and the soroban-sdk v23 toolchain.
[workspace.package]
edition = "2021"
rust-version = "1.84"
license = "Apache-2.0"
repository = "https://github.com/tycoon/tycoon-monorepo"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
